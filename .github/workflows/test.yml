name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Verify determinism
        run: |
          python -m doorman.watch --log fixtures/access_small.log --vendors fixtures/vendor_ips.json --out /tmp/rep1 --fixture-label "synthetic fixture" > /dev/null
          python -m doorman.watch --log fixtures/access_small.log --vendors fixtures/vendor_ips.json --out /tmp/rep2 --fixture-label "synthetic fixture" > /dev/null
          diff -r /tmp/rep1 /tmp/rep2
